# kind v0.25's kindest/node:v1.28.15 runs containerd 1.7, as node images built
# by kind v0.20 to v0.26 do. It creates an image for every manifest at the top
# level of an imported archive and unpacks it, referrers such as attestations
# included. kind's default node runs containerd 2, which only unpacks manifests
# that have filesystem layers, so the import test on the default node cannot
# tell.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: containerd17
nodes:
  - role: control-plane
    image: kindest/node:v1.28.15@sha256:a7c05c7ae043a0b8c818f5a06188bc2c4098f6cb59ca7d1856df00375d839251
