# Tests import-images into a containerd 1.7 node with multi-platform images the
# run pulls itself, as projects using infra-e2e do; this failed in real use
# while the test on kind's default node passed. With docker's containerd image
# store, importing every platform of such an image fails with "content digest
# ... not found", and importing its referrers, such as attestations, as images
# fails with "mismatched image rootfs and manifest layers".

setup:
  env: kind
  file: kind-cluster.yaml
  timeout: 10m
  kind:
    import-images:
      - ghcr.io/apache/skywalking/oap:f34b9c7ef04792fcd48869aaa44c88f2e802ebc4
      - ghcr.io/apache/skywalking-rover/skywalking-rover:79292fe07f17f98f486e0c4471213e1961fb2d1d
  # without steps, the setup skips creating the cluster
  steps:
    - name: list the node
      command: kubectl get nodes

cleanup:
  on: always

verify:
  retry:
    count: 3
    interval: 5s
  cases:
    - name: verify the images were imported into the node
      query: docker exec containerd17-control-plane crictl images -o json | jq '[.images[].repoTags[]] | map(select(. == "ghcr.io/apache/skywalking/oap:f34b9c7ef04792fcd48869aaa44c88f2e802ebc4" or . == "ghcr.io/apache/skywalking-rover/skywalking-rover:79292fe07f17f98f486e0c4471213e1961fb2d1d")) | length'
      expected: expected.yaml
